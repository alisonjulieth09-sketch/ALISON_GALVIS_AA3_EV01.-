<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Productos</title><link rel="stylesheet" th:href="@{/css/estilos.css}"></head><body><main class="contenedor"><h1>Registro de producto</h1><form th:action="@{/productos}" th:object="${producto}" method="post"><label>Nombre</label><input th:field="*{nombre}" required><label>Categoría</label><select th:field="*{categoria}" required><option value="">Seleccione</option><option>Camisas</option><option>Pantalones</option><option>Vestidos</option><option>Accesorios</option></select><label>Precio</label><input type="number" step="0.01" th:field="*{precio}" required><label>Cantidad</label><input type="number" min="1" th:field="*{cantidad}" required><button>Guardar producto</button></form><a href="/">Volver</a></main></body></html>
